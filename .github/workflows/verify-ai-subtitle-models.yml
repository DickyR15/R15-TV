name: Verify all R15 TV AI subtitle model checksums

on:
  workflow_dispatch:
  push:
    branches:
      - research/autobuild-170-port
    paths:
      - ".github/workflows/verify-ai-subtitle-models.yml"
      - "config/ai-subtitle-models.json"

permissions:
  contents: read
  actions: read

jobs:
  verify:
    name: Download and verify every pinned model hash
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download every pinned ASR artifact and verify SHA-256 plus exact byte length
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import urllib.request
          from pathlib import Path

          manifest_path = Path("config/ai-subtitle-models.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          entries = []
          for pack in manifest.get("languages", []):
              for entry in pack.get("files", []):
                  entries.append((pack["id"], entry))
          vad = manifest.get("common", {}).get("vad")
          if vad:
              entries.append(("common", vad))

          failures = 0
          for pack_id, entry in entries:
              url = entry["url"]
              req = urllib.request.Request(url, headers={"User-Agent": "R15-TV-model-checksum-verifier"})
              digest = hashlib.sha256()
              actual_size = 0
              with urllib.request.urlopen(req, timeout=90) as response:
                  while True:
                      chunk = response.read(1024 * 1024)
                      if not chunk:
                          break
                      digest.update(chunk)
                      actual_size += len(chunk)
              actual_sha = digest.hexdigest()
              expected_sha = entry["sha256"].lower()
              expected_size = int(entry["sizeBytes"])
              matches = actual_sha == expected_sha and actual_size == expected_size
              print(
                  f"MODEL_VERIFY id={pack_id} file={entry['name']} "
                  f"sha256={actual_sha} bytes={actual_size} "
                  f"sha_match={actual_sha == expected_sha} size_match={actual_size == expected_size}"
              )
              if not matches:
                  print(
                      f"::error::Pinned model hash/size mismatch for {pack_id}/{entry['name']}; "
                      f"expected sha256={expected_sha} bytes={expected_size}"
                  )
                  failures += 1
          if failures:
              raise SystemExit(f"{failures} of {len(entries)} model files failed integrity checks")
          print(f"Verified exact SHA-256 and byte size for all {len(entries)} model assets.")
          PY
