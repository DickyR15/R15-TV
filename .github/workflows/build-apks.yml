name: Build R15 TV APKs
run-name: R15 TV APK Build (manual or source update)

on:
  push:
    branches:
      - "diagnostic/live-v7a-fixed-debug-sign"
    paths:
      - ".github/workflows/build-apks.yml"
      - "config/**"
      - "patches/**"
      - "scripts/**"
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a GitHub Release after a successful signed build
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  # Keep the build queue isolated by ref so an orphaned runner on a prior
  # workflow revision cannot block repaired builds indefinitely.
  group: r15tv-public-build-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_REPOSITORY: FongMi/TV
  SOURCE_BRANCH: fongmi
  NDK_VERSION: 29.0.14206865
  # Diagnostic branch only: fe6a5b2 is the last upstream snapshot proven to
  # compile with the pinned public Media3 source below. The newer 9c845a9 TV
  # commit references Media3 APIs absent from that public tree, causing >100
  # unresolved symbols. Re-sync the matching Media3 source before moving this
  # diagnostic build back to the latest upstream TV source.
  SOURCE_SHA: fe6a5b235477c02633cf3bc50d4cd83414a521b4
  MEDIA_REPOSITORY: FongMi/media
  MEDIA_BRANCH: release-1.11.0-fongmi
  MEDIA_SHA: 3c2cbe8ac742c2fe15eff52f03eeb3b1b648848d
  OPENCC_VERSION: 1.4.2
  OPENCC_COMMIT: 025f371dc76b598d77384fbdab90c937471844d8
  SHERPA_VERSION: 1.13.8
  SHERPA_COMMIT: 11afbd009a7f8c08f4bcf2fc1b265d0df4670fbf

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout R15 TV build configuration
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          path: .

      - name: Resolve pinned public source revision
        id: source
        shell: bash
        run: |
          set -euo pipefail
          echo "SOURCE_SHA=${SOURCE_SHA}" >> "$GITHUB_ENV"
          echo "MEDIA_SHA=${MEDIA_SHA}" >> "$GITHUB_ENV"
          echo "Pinned upstream TV: ${SOURCE_REPOSITORY}@${SOURCE_SHA}"
          echo "Pinned Media3/MPV: ${MEDIA_REPOSITORY}@${MEDIA_SHA}"

      - name: Fetch public FongMi/TV source without credentials
        shell: bash
        env:
          EXPECTED_SHA: ${{ env.SOURCE_SHA }}
        run: |
          set -euo pipefail
          mkdir -p sources/TV
          git -C sources/TV init
          git -C sources/TV remote add origin "https://github.com/${SOURCE_REPOSITORY}.git"
          git -C sources/TV fetch --depth=1 origin "$EXPECTED_SHA"
          git -C sources/TV checkout --detach FETCH_HEAD
          actual_sha="$(git -C sources/TV rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          test -f sources/TV/gradlew
          test -f sources/TV/app/build.gradle
          # ForceTech AAR exists in older upstream revisions but was removed from current FongMi/TV.
          if grep -R -Fq "forcetech-release.aar" sources/TV/app/build.gradle sources/TV/app/*.gradle; then
            test -f sources/TV/app/libs/forcetech-release.aar
          fi
          test -f sources/TV/LICENSE.md
          test -f sources/TV/chaquo/build.gradle
          chmod +x sources/TV/gradlew
          echo "Public source checked out: FongMi/TV@$actual_sha"
          echo "This build does not include IPTV/live-playlist sources."

      - name: Fetch pinned FongMi Media3 and MPV source
        shell: bash
        env:
          EXPECTED_MEDIA_SHA: ${{ env.MEDIA_SHA }}
        run: |
          set -euo pipefail
          mkdir -p sources/media
          git -C sources/media init
          git -C sources/media remote add origin "https://github.com/${MEDIA_REPOSITORY}.git"
          git -C sources/media fetch --depth=1 origin "$EXPECTED_MEDIA_SHA"
          git -C sources/media checkout --detach FETCH_HEAD
          actual_media_sha="$(git -C sources/media rev-parse HEAD)"
          test "$actual_media_sha" = "$EXPECTED_MEDIA_SHA"
          test -f sources/media/gradlew
          test -f sources/media/move.txt
          chmod +x sources/media/gradlew
          echo "Pinned Media3 source checked out: $actual_media_sha"

      - name: Verify checkout and required public dependencies
        shell: bash
        run: |
          set -euo pipefail
          test -s sources/TV/LICENSE.md
          test -s sources/media/LICENSE
          echo "Verified source licenses and pinned source files."

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: sources/TV/**/*.gradle*

      - name: Skip optional reference APK decompilation
        run: |
          echo "Optional reference APK decompilation skipped to keep the build path deterministic."

      - name: Set up Python for Chaquopy build
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: sources/TV/chaquo/requirements.txt

      - name: Install latest OpenCC tooling and validate subtitle catalogs
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install opencc-python-reimplemented
          python3 -m py_compile scripts/apply-taiwan-localization.py scripts/apply-live-connect-fix.py scripts/apply-long-press-speed.py scripts/apply-ai-subtitle.py
          echo "Python tooling and patch syntax verified."

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install             "platform-tools"             "platforms;android-37"             "build-tools;36.0.0"             "cmake;3.22.1"             "ndk;${NDK_VERSION}"
          # Android setup installs build-tools but does not always add its tools to PATH.
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Build official FongMi Media3 and MPV AAR dependencies
        working-directory: sources/media
        timeout-minutes: 20
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"
        run: |
          set -euo pipefail
          chmod +x gradlew
          timeout 75m ./gradlew --no-daemon --stacktrace --console=plain --max-workers=2             :lib-common:assembleRelease             :lib-container:assembleRelease             :lib-database:assembleRelease             :lib-datasource:assembleRelease             :lib-datasource-okhttp:assembleRelease             :lib-datasource-rtmp:assembleRelease             :lib-decoder:assembleRelease             :lib-decoder-ffmpeg:assembleRelease             :lib-decoder-mpegh:assembleRelease             :lib-effect:assembleRelease             :lib-exoplayer:assembleRelease             :lib-exoplayer-dash:assembleRelease             :lib-exoplayer-hls:assembleRelease             :lib-exoplayer-rtsp:assembleRelease             :lib-exoplayer-smoothstreaming:assembleRelease             :lib-extractor:assembleRelease             :lib-mpvplayer:assembleRelease             :lib-session:assembleRelease             :lib-ui:assembleRelease             :lib-ui-danmaku:assembleRelease

          target="$GITHUB_WORKSPACE/sources/TV/app/libs"
          mkdir -p "$target"
          copied=0
          while IFS= read -r aar_name; do
            [[ -n "$aar_name" ]] || continue
            module="${aar_name#lib-}"
            module="${module%-release.aar}"
            module_dir="${module//-/_}"
            aar_path="libraries/$module_dir/buildout/outputs/aar/$aar_name"
            if [[ ! -f "$aar_path" ]]; then
              aar_path=$(find libraries -type f -name "$aar_name" -print -quit)
            fi
            if [[ -z "$aar_path" || ! -f "$aar_path" ]]; then
              echo "Missing expected AAR: $aar_name" >&2
              exit 1
            fi
            cp "$aar_path" "$target/$aar_name"
            copied=$((copied + 1))
          done < move.txt

          if [[ "$copied" -ne 20 ]]; then
            echo "Expected 20 Media3/MPV AARs, copied $copied." >&2
            exit 1
          fi
          echo "Copied $copied pinned Media3/MPV AARs into app/libs:"
          ls -lh "$target"/lib-*-release.aar
          sha256sum "$target"/lib-*-release.aar

      - name: Fetch official OpenCC 1.4.2 source
        env:
          EXPECTED_OPENCC_COMMIT: ${{ env.OPENCC_COMMIT }}
        run: |
          set -euo pipefail
          mkdir -p sources/OpenCC
          git -C sources/OpenCC init
          git -C sources/OpenCC remote add origin https://github.com/BYVoid/OpenCC.git
          git -C sources/OpenCC fetch --depth=1 origin refs/tags/ver.1.4.2
          git -C sources/OpenCC checkout --detach FETCH_HEAD
          actual=$(git -C sources/OpenCC rev-parse HEAD)
          test "$actual" = "$EXPECTED_OPENCC_COMMIT"
          test -s sources/OpenCC/LICENSE
          test -s sources/OpenCC/data/config/s2twp.json
          echo "Official OpenCC 1.4.2 source: $actual"

      - name: Build OpenCC 1.4.2 dictionaries and Android JNI for both ABIs
        shell: bash
        run: |
          set -euo pipefail
          cmake -S sources/OpenCC -B build/opencc-host             -DCMAKE_BUILD_TYPE=Release             -DBUILD_SHARED_LIBS=OFF             -DOPENCC_ENABLE_INSTALL=OFF             -DENABLE_GTEST=OFF             -DENABLE_BENCHMARK=OFF             -DBUILD_DOCUMENTATION=OFF             -DBUILD_PYTHON=OFF             -DOPENCC_DICT_FORMAT=ocd2
          cmake --build build/opencc-host --target Dictionaries --parallel 2

          asset_root="sources/TV/app/src/main/assets/opencc-1.4.2"
          mkdir -p "$asset_root/config" "$asset_root/dictionary"
          cp sources/OpenCC/data/config/s2twp.json "$asset_root/config/s2twp.json"
          cp sources/OpenCC/LICENSE "$asset_root/LICENSE"
          dictionaries=(
            CJK_Compatibility_Ideographs.ocd2
            STPhrases.ocd2
            STPhrases_GeneratedFromRegionalPhrases.ocd2
            STCharacters.ocd2
            TWPhrases.ocd2
            TWVariantsPhrases.ocd2
            TWVariants.ocd2
          )
          for dictionary in "${dictionaries[@]}"; do
            source_file="build/opencc-host/data/$dictionary"
            test -s "$source_file"
            cp "$source_file" "$asset_root/dictionary/$dictionary"
          done

          app_java="sources/TV/app/src/main/java/com/fongmi/android/tv/ai/subtitle"
          mkdir -p "$app_java"
          cp patches/ai-subtitle/TaiwanTraditionalConverter.java "$app_java/TaiwanTraditionalConverter.java"
          for abi in arm64-v8a armeabi-v7a; do
            build_dir="$GITHUB_WORKSPACE/build/opencc-android-$abi"
            cmake -S patches/opencc-android -B "$build_dir"               -DOPENCC_SOURCE_DIR="$GITHUB_WORKSPACE/sources/OpenCC"               -DCMAKE_TOOLCHAIN_FILE="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION/build/cmake/android.toolchain.cmake"               -DANDROID_ABI="$abi"               -DANDROID_PLATFORM=android-24               -DANDROID_STL=c++_static               -DCMAKE_BUILD_TYPE=Release               -DCMAKE_POSITION_INDEPENDENT_CODE=ON
            cmake --build "$build_dir" --target r15opencc --parallel 2
            native_lib=$(find "$build_dir" -type f -name libr15opencc.so -print -quit)
            test -n "$native_lib" && test -s "$native_lib"
            mkdir -p "sources/TV/app/src/main/jniLibs/$abi"
            install -m 755 "$native_lib" "sources/TV/app/src/main/jniLibs/$abi/libr15opencc.so"
          done
          echo "Built official OpenCC 1.4.2 JNI and current s2twp dictionaries for both Android ABIs."

      - name: Fetch pinned sherpa-onnx 1.13.8 Android AAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sources/TV/app/libs
          curl -fL --retry 3 --retry-all-errors             "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar"             -o sources/TV/app/libs/sherpa-onnx-v1.13.8.aar
          echo "633c24321e06b1fe79feafa03ea16cbc0f8a286641e2da3559bac91bdb13bd96  sources/TV/app/libs/sherpa-onnx-v1.13.8.aar" | sha256sum --check
          unzip -l sources/TV/app/libs/sherpa-onnx-v1.13.8.aar > build/sherpa-aar-contents.txt
          for abi in arm64-v8a armeabi-v7a; do
            grep -Fq "jni/$abi/libsherpa-onnx-jni.so" build/sherpa-aar-contents.txt
            grep -Fq "jni/$abi/libonnxruntime.so" build/sherpa-aar-contents.txt
          done
          echo "Verified the official sherpa-onnx 1.13.8 Android AAR and required native libraries."
          # The official Android AAR already embeds the matching Java API classes.
          # Keep the JVM JAR for source integrity verification only, not app/libs.
          curl -fL --retry 3 --retry-all-errors             "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-jvm-1.13.8.jar"             -o build/sherpa-onnx-jvm-v1.13.8.jar
          echo "77b7b047fade4eadada96b568eb92615049aaf1dc317c7244e46c1ea38b9a63b  build/sherpa-onnx-jvm-v1.13.8.jar" | sha256sum --check
          jar tf build/sherpa-onnx-jvm-v1.13.8.jar | grep -F "com/k2fsa/sherpa/onnx/OnlineRecognizer.class"
          echo "Verified matching official sherpa-onnx 1.13.8 JVM API JAR; Android APK will use classes packaged in the AAR."

      - name: Stage R15 AI subtitle classes and verify native dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/apply-ai-subtitle.py
          # Guard against accidental package headers copied from the old POC namespace.
          if grep -R -n "POC UI is packaged" patches/ai-subtitle; then
            echo "Remove stale POC namespace comments before staging." >&2
            exit 1
          fi
          python3 scripts/apply-ai-subtitle.py --tv-dir sources/TV --patch-dir patches/ai-subtitle
          test -s sources/TV/app/libs/sherpa-onnx-v1.13.8.aar
          for abi in arm64-v8a armeabi-v7a; do
            test -s "sources/TV/app/src/main/jniLibs/$abi/libr15opencc.so"
          done
          echo "Staged AI subtitle classes and OpenCC native runtime."

      - name: Apply R15 TV patches
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply-taiwan-localization.py --tv-dir sources/TV
          python3 scripts/apply-long-press-speed.py --tv-dir sources/TV
          python3 scripts/apply-live-connect-fix.py --tv-dir sources/TV --patch-dir patches/live-sources
          echo "R15 TV source patches applied."

      - name: Verify app branding and source metadata
        shell: bash
        run: |
          set -euo pipefail
          test -s sources/TV/app/src/main/AndroidManifest.xml
          grep -R -Fq "R15 TV" sources/TV/app/src/main/res
          echo "Branding and source patch sanity checks passed."

      - name: Configure Android 9 diagnostic renderer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("sources/TV/app/src/main/java/com/fongmi/android/tv/ui/activity/PlaybackActivity.java")
          text = p.read_text(encoding="utf-8")
          marker = "playerView.setRender(Build.VERSION.SDK_INT <= Build.VERSION_CODES.P ? PlayerSetting.RENDER_SURFACE : PlayerSetting.getRender());"
          if marker not in text:
              old = "playerView.setRender(PlayerSetting.getRender());"
              if text.count(old) != 1:
                  raise SystemExit("Expected one renderer selection point in PlaybackActivity")
              text = text.replace(old, marker, 1)
          p.write_text(text, encoding="utf-8")
          print("Android 9 diagnostic renderer: SurfaceView; Android 10+ keeps saved setting.")
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          for flavor in ("leanback", "mobile"):
              p = Path(f"sources/TV/app/src/{flavor}/AndroidManifest.xml")
              text = p.read_text(encoding="utf-8")
              pattern = re.compile(r'<activity\b[^>]*android:name="\.ui\.activity\.LiveActivity"[^>]*>')
              matches = list(pattern.finditer(text))
              if len(matches) != 1:
                  raise SystemExit(f"{p}: expected exactly one LiveActivity declaration")
              tag = matches[0].group(0)
              attr = re.compile(r'android:hardwareAccelerated="[^"]*"')
              tag = attr.sub('android:hardwareAccelerated="true"', tag, count=1) if attr.search(tag) else tag[:-1] + '\n            android:hardwareAccelerated="true">'
              text = text[:matches[0].start()] + tag + text[matches[0].end():]
              p.write_text(text, encoding="utf-8")
          print("LiveActivity hardware acceleration enabled for renderer diagnostic.")
          PY
          echo "Android 9 renderer diagnostic configured."

      - name: Set up Gradle environment and signing
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.R15TV_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.R15TV_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.R15TV_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p build
          if [[ -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "Missing R15TV signing secrets." >&2
            exit 1
          fi
          cat > sources/TV/local.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/keystore/r15tv.jks
          keyAlias=$KEY_ALIAS
          storePassword=$STORE_PASSWORD
          EOF
          echo "storePassword=staged-at-build-time" > build/signing-presence.txt
          # Download the same key from the configured secret payload.
          echo "Signing environment configured."

      - name: Configure Leanback debug APK signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.R15TV_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > keystore/r15tv.jks
          test -s keystore/r15tv.jks
          test -s sources/TV/local.properties
          echo "Persistent R15 TV signing key installed."

      - name: Record exact upstream source revision
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          cat > build/upstream-source.txt <<EOF
          repository=$SOURCE_REPOSITORY
          branch=$SOURCE_BRANCH
          sha=$SOURCE_SHA
          media_repository=$MEDIA_REPOSITORY
          media_branch=$MEDIA_BRANCH
          media_sha=$MEDIA_SHA
          EOF
          cat build/upstream-source.txt

      - name: Build only R15 TV Leanback armeabi-v7a debug APK
        working-directory: sources/TV
        timeout-minutes: 90
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace --console=plain --max-workers=2             --offline             :app:assembleLeanbackDebug -PabiList=armeabi-v7a

      - name: Verify OpenCC 1.4.2, manifests and the single APK
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find sources/TV/app/build/outputs/apk/leanback -type f -name '*.apk' -print -quit)
          test -n "$apk" && test -s "$apk"
          aapt dump badging "$apk" | grep -F "package: name='com.dicky.r15tv.diagtrace'"
          aapt dump badging "$apk" | grep -F "application-label:'R15 TV 崩潰追蹤診斷'"
          unzip -l "$apk" > build/apk-files.txt
          grep -Fq "assets/opencc-1.4.2/config/s2twp.json" build/apk-files.txt
          for dictionary in CJK_Compatibility_Ideographs STPhrases STPhrases_GeneratedFromRegionalPhrases STCharacters TWPhrases TWVariantsPhrases TWVariants; do
            grep -Fq "assets/opencc-1.4.2/dictionary/$dictionary.ocd2" build/apk-files.txt
          done
          grep -Fq "lib/armeabi-v7a/libr15opencc.so" build/apk-files.txt
          grep -Fq "lib/armeabi-v7a/libsherpa-onnx-jni.so" build/apk-files.txt
          grep -Fq "lib/armeabi-v7a/libonnxruntime.so" build/apk-files.txt
          aapt dump badging "$apk" | grep -F "sdkVersion:'24'"
          aapt dump badging "$apk" | grep -F "targetSdkVersion:'37'"
          sha256sum "$apk" | tee build/apk-sha256.txt
          cp "$apk" build/R15TV-diagnostic-Android9-armeabi-v7a.apk
          test -s build/R15TV-diagnostic-Android9-armeabi-v7a.apk
          echo "APK verified with package name, OpenCC 1.4.2 assets, native dependencies, and Android 9 minimum API."

      - name: Package APKs and verification metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/R15TV-diagnostic
          cp build/R15TV-diagnostic-Android9-armeabi-v7a.apk release/R15TV-diagnostic/
          cp build/upstream-source.txt build/apk-sha256.txt build/apk-files.txt release/R15TV-diagnostic/
          printf 'Build diagnostic APK for Android 9 (armeabi-v7a).\n' > release/R15TV-diagnostic/README.txt
          (cd release && zip -qr ../R15TV-diagnostic-Android9-armeabi-v7a.zip R15TV-diagnostic)
          test -s R15TV-diagnostic-Android9-armeabi-v7a.zip
          echo "Packaged diagnostic APK and source verification metadata."

      - name: Upload APKs and source metadata
        uses: actions/upload-artifact@v4
        with:
          name: R15TV-diagnostic-Android9-armeabi-v7a
          path: |
            build/R15TV-diagnostic-Android9-armeabi-v7a.apk
            R15TV-diagnostic-Android9-armeabi-v7a.zip
            build/upstream-source.txt
            build/apk-sha256.txt
            build/apk-files.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: r15tv-diagnostic-${{ github.run_number }}
          name: R15 TV Android 9 diagnostic build #${{ github.run_number }}
          files: |
            build/R15TV-diagnostic-Android9-armeabi-v7a.apk
            R15TV-diagnostic-Android9-armeabi-v7a.zip
