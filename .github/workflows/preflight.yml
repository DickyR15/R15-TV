name: R15-TV Build Preflight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "LICENSE"
      - "config/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  preflight:
    name: Check build prerequisites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate source manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("config/sources.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          assert data.get("schema") == 1
          sources = data.get("sources", {})
          assert set(sources) == {"TV"}, f"Unexpected source set: {sorted(sources)}"
          source = sources["TV"]
          assert source.get("repository") == "FongMi/TV"
          assert source.get("branch") == "fongmi"
          assert source.get("requiresPrivateSourceAccess") is False
          assert source.get("bundledLiveSources") is False
          print("Public source manifest and no-live-sources setting: OK")
          PY

      - name: Explain signing prerequisites
        run: |
          echo "The APK workflow can build debug APKs without signing secrets."
          echo "For stable release APKs, configure your own R15TV_KEYSTORE_B64, R15TV_STORE_PASSWORD, and R15TV_KEY_PASSWORD."
          echo "No private upstream source token is needed."
          echo "This preflight does not compile the APK; use the Build R15-TV APKs workflow."
