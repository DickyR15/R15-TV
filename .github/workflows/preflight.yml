name: R15-TV Public Source Preflight

on:
  workflow_dispatch:
  push:
    branches: [main, public-fongmi-base]
    paths:
      - "README.md"
      - "config/**"
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  preflight:
    name: Validate public source configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout R15-TV
        uses: actions/checkout@v4

      - name: Validate manifest and confirm public upstream
        run: |
          set -euo pipefail
          repository=$(jq -er '.sources.TV.repository' config/sources.json)
          branch=$(jq -er '.sources.TV.branch' config/sources.json)
          requires_private=$(jq -er '.sources.TV.requiresPrivateSourceAccess' config/sources.json)
          test "$repository" = "FongMi/TV"
          test "$branch" = "fongmi"
          test "$requires_private" = "false"
          response=$(curl --fail --silent --show-error --location "https://api.github.com/repos/$repository/git/ref/heads/$branch")
          sha=$(jq -er '.object.sha' <<< "$response")
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "Public source is reachable: $repository:$branch ($sha)"
          echo "No personal source token is needed for this public repository."
          echo "This preflight checks source access only; it does not compile the APK."
