name: R15 TV Public Source Preflight

on:
  workflow_dispatch:
  push:
    branches: [public-source-build]
    paths:
      - "README.md"
      - "config/**"
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  preflight:
    name: Check public build prerequisites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate public source manifest and build workflow
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path("config/sources.json").read_text(encoding="utf-8"))
          assert config.get("schema") == 1
          source = config.get("sources", {}).get("TV", {})
          assert source.get("repository") == "FongMi/TV"
          assert source.get("branch") == "fongmi"
          assert source.get("requiresPrivateSourceAccess") is False
          assert source.get("bundledLiveSources") is False

          workflow = Path(".github/workflows/build-apks.yml").read_text(encoding="utf-8")
          resolver = Path("scripts/resolve-sources.sh").read_text(encoding="utf-8")
          assert "R15TV_SOURCE_TOKEN" not in workflow + resolver
          assert "PRIVATE_SOURCE_TOKEN" not in workflow + resolver
          assert "R15TV_KEYSTORE_B64" in workflow
          assert "R15 TV-source.patch" in workflow
          print("Public source manifest: OK")
          print("Private source token dependency: absent")
          print("Signing and source patch metadata steps: present")
          PY

      - name: Confirm public source is reachable
        run: |
          sha=$(git ls-remote https://github.com/FongMi/TV.git refs/heads/fongmi | awk 'NR == 1 {print $1}')
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Unable to resolve the public FongMi/TV fongmi branch." >&2
            exit 1
          fi
          echo "Public FongMi/TV revision: $sha"
          echo "This preflight checks access/configuration; it does not compile the APK."
