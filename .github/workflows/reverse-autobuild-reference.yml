name: Reverse engineer TV-AutoBuild 170 reference
run-name: Reverse TV-AutoBuild 170 APK UI

on:
  push:
    branches:
      - "research/autobuild-170-port"
    paths:
      - ".github/workflows/reverse-autobuild-reference.yml"

permissions:
  contents: read
  actions: read

jobs:
  reverse:
    name: Decode reference APK layouts and classes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Download and decompile official APK
        run: |
          set -euo pipefail
          mkdir -p build/autobuild170
          apk="build/autobuild170/TV-leanback-armeabi-v7a.apk"
          curl -fL --retry 3 --retry-delay 2 \
            "https://github.com/iptvorganization/TV-AutoBuild/releases/download/autobuild-170/TV-leanback-armeabi-v7a.apk" \
            -o "$apk"
          echo "836fec0255d7f9860ef3d48b4680a26ee14301167e54c289346a551bb970da41  $apk" | sha256sum -c -
          curl -fL --retry 3 \
            "https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar" \
            -o build/autobuild170/apktool.jar
          curl -fL --retry 3 \
            "https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip" \
            -o build/autobuild170/jadx.zip
          unzip -q build/autobuild170/jadx.zip -d build/autobuild170/jadx-dist
          jadx_bin="$(find build/autobuild170/jadx-dist -type f -path '*/bin/jadx' -print -quit)"
          test -n "$jadx_bin"
          chmod +x "$jadx_bin"
          java -jar build/autobuild170/apktool.jar d -f -s "$apk" -o build/autobuild170/resources
          # JADX may exit 3 after emitting usable sources if a few third-party classes fail to decompile.
          "$jadx_bin" --show-bad-code -d build/autobuild170/sources "$apk" || echo "JADX reported some per-class decompilation errors; inspecting emitted source files."
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = Path("build/autobuild170")
          resource_root = root / "resources"
          source_root = root / "sources"

          resource_report = [
              "TV-AutoBuild autobuild-170 APK reverse-engineering report",
              "Reference APK: official TV-leanback-armeabi-v7a.apk",
              ""
          ]
          manifest = resource_root / "AndroidManifest.xml"
          if manifest.exists():
              resource_report.append("=== Activities relevant to Live / Config / Settings ===")
              try:
                  doc = ET.parse(manifest).getroot()
                  android = "{http://schemas.android.com/apk/res/android}"
                  for node in doc.iter():
                      if node.tag.endswith("activity"):
                          name = node.attrib.get(android + "name", "")
                          if any(k in name.lower() for k in ("live", "config", "setting", "wall", "vod", "media")):
                              resource_report.append(f"{name} | label={node.attrib.get(android + 'label', '')}")
              except Exception as exc:
                  resource_report.append(f"Manifest parse warning: {exc}")
              resource_report.append("")

          resource_report.append("=== Exact target XML layouts ===")
          layout_names = (
              "activity_setting.xml",
              "activity_live_config.xml",
              "activity_live_config_edit.xml",
              "activity_media_config.xml",
              "adapter_live_config_source.xml",
              "dialog_config.xml"
          )
          for name in layout_names:
              matches = sorted(resource_root.rglob(name))
              for path in matches:
                  lines = path.read_text(errors="replace").splitlines()
                  resource_report.append(f"--- {path.relative_to(resource_root)} ({len(lines)} lines) ---")
                  resource_report.extend(lines[:220])
                  if len(lines) > 220:
                      resource_report.append(f"... omitted {len(lines)-220} lines")
                  resource_report.append("")

          resource_report.append("=== Original Taiwan-Chinese strings for Live / Media settings and phone push ===")
          for path in sorted(resource_root.rglob("strings.xml")):
              if not any(k in str(path).lower() for k in ("zh-rtw", "values/strings")):
                  continue
              for line in path.read_text(errors="replace").splitlines():
                  if any(k in line.lower() for k in (
                      "live_config_", "setting_live", "setting_media_config",
                      "setting_vod", "setting_wall", "push_info", "setting_promotion"
                  )):
                      resource_report.append(f"{path.relative_to(resource_root)}: {line.strip()}")
          resource_report.append("")

          focus_names = {
              "liveconfigactivity.java", "liveconfigeditactivity.java",
              "mediaconfigactivity.java", "settingactivity.java",
              "action.java", "serverevent.java", "server.java",
              "nano.java", "qrcode.java", "pushactivity.java",
              "configdialog.java"
          }
          focus_terms = (
              "LiveConfigActivity", "LiveConfigEditActivity", "MediaConfigActivity",
              "setting_media_config", "live_config_remote_helper",
              "ServerEvent.setting", "Server.get().getAddress",
              "QRCode.getBitmap", "/action?do=setting"
          )
          candidates = []
          for path in sorted(source_root.rglob("*.java")):
              body = path.read_text(errors="replace")
              hits = [term for term in focus_terms if term.lower() in body.lower()]
              if path.name.lower() in focus_names or hits:
                  candidates.append((path, body, hits))

          source_report = ["=== Decompiled source candidates (JADX may skip unsupported third-party classes) ==="]
          for path, body, hits in candidates:
              source_report.append(f"{path.relative_to(source_root)} | hits={', '.join(hits) if hits else '(target class name)'}")
          source_report.append("")
          source_report.append("=== Decompiled source for target classes ===")
          for path, body, hits in candidates:
              lines = body.splitlines()
              source_report.append(f"--- {path.relative_to(source_root)} ({len(lines)} lines) ---")
              if len(lines) <= 520:
                  source_report.extend(f"{i+1}: {line}" for i, line in enumerate(lines))
              else:
                  anchors = [i for i, line in enumerate(lines) if any(term.lower() in line.lower() for term in focus_terms)]
                  ranges = []
                  for i in anchors:
                      lo, hi = max(0, i-30), min(len(lines), i+65)
                      if ranges and lo <= ranges[-1][1]:
                          ranges[-1] = (ranges[-1][0], max(ranges[-1][1], hi))
                      else:
                          ranges.append((lo, hi))
                  for lo, hi in ranges[:8]:
                      source_report.extend(f"{i+1}: {lines[i]}" for i in range(lo, hi))
              source_report.append("")

          resource_text = "\\n".join(resource_report)
          source_text = "\\n".join(source_report)
          (root / "reverse-engineering-report.txt").write_text(
              resource_text + "\\n\\n" + source_text, encoding="utf-8"
          )
          print("=== AUTOBUILD170_RESOURCE_REPORT_BEGIN ===")
          print(resource_text[:36000])
          print("=== AUTOBUILD170_RESOURCE_REPORT_END ===")
          print("=== AUTOBUILD170_SOURCE_REPORT_BEGIN ===")
          print(source_text[:48000])
          print("=== AUTOBUILD170_SOURCE_REPORT_END ===")
          PY

      - name: Upload decompilation report
        uses: actions/upload-artifact@v4
        with:
          name: AutoBuild-170-Reverse-Engineering
          path: build/autobuild170/reverse-engineering-report.txt
          if-no-files-found: error
          retention-days: 7
