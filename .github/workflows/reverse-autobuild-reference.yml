name: Reverse engineer TV-AutoBuild 170 reference
run-name: Reverse TV-AutoBuild 170 APK UI

on:
  push:
    branches:
      - "research/autobuild-170-port"
    paths:
      - ".github/workflows/reverse-autobuild-reference.yml"

permissions:
  contents: read
  actions: read

jobs:
  reverse:
    name: Decode reference APK layouts and classes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Download and decompile official APK
        run: |
          set -euo pipefail
          mkdir -p build/autobuild170
          apk="build/autobuild170/TV-leanback-armeabi-v7a.apk"
          curl -fL --retry 3 --retry-delay 2 \
            "https://github.com/iptvorganization/TV-AutoBuild/releases/download/autobuild-170/TV-leanback-armeabi-v7a.apk" \
            -o "$apk"
          echo "836fec0255d7f9860ef3d48b4680a26ee14301167e54c289346a551bb970da41  $apk" | sha256sum -c -
          curl -fL --retry 3 \
            "https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar" \
            -o build/autobuild170/apktool.jar
          curl -fL --retry 3 \
            "https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip" \
            -o build/autobuild170/jadx.zip
          unzip -q build/autobuild170/jadx.zip -d build/autobuild170/jadx-dist
          jadx_bin="$(find build/autobuild170/jadx-dist -type f -path '*/bin/jadx' -print -quit)"
          test -n "$jadx_bin"
          chmod +x "$jadx_bin"
          java -jar build/autobuild170/apktool.jar d -f -s "$apk" -o build/autobuild170/resources
          # JADX may exit 3 after emitting usable sources if a few third-party classes fail to decompile.
          "$jadx_bin" --show-bad-code -d build/autobuild170/sources "$apk" || echo "JADX reported some per-class decompilation errors; inspecting emitted source files."
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = Path("build/autobuild170")
          resource_root = root / "resources"
          source_root = root / "sources"
          report = [
              "TV-AutoBuild autobuild-170 APK reverse-engineering report",
              "Reference: official TV-leanback-armeabi-v7a.apk",
              ""
          ]
          manifest = resource_root / "AndroidManifest.xml"
          if manifest.exists():
              report.append("=== Activities relevant to Live / Config / Settings ===")
              try:
                  doc = ET.parse(manifest).getroot()
                  android = "{http://schemas.android.com/apk/res/android}"
                  for node in doc.iter():
                      if node.tag.endswith("activity"):
                          name = node.attrib.get(android + "name", "")
                          if any(k in name.lower() for k in ("live", "config", "setting", "wall", "vod")):
                              report.append(f"{name} | label={node.attrib.get(android + 'label', '')}")
              except Exception as exc:
                  report.append(f"Manifest parse warning: {exc}")
              report.append("")

          report.append("=== Relevant XML layouts ===")
          layouts = sorted((resource_root / "res").glob("layout*/*.xml"))
          for path in layouts:
              if not any(k in path.name.lower() for k in ("live", "config", "setting", "source", "wall", "vod")):
                  continue
              lines = path.read_text(errors="replace").splitlines()
              report.append(f"--- {path.relative_to(resource_root)} ({len(lines)} lines) ---")
              report.extend(lines[:180])
              if len(lines) > 180:
                  report.append(f"... omitted {len(lines)-180} lines")
              report.append("")

          terms = (
              "Server.get().getAddress", "QRCode.getBitmap", "ServerEvent.setting",
              "自動重新整理配置", "新增直播源配置", "直播配置", "節目表位址",
              "push_info", "LiveSourcesActivity", "ConfigDialog", "vodAndWall",
              "User-Agent", "Referer"
          )
          candidates = []
          for path in sorted(source_root.rglob("*.java")):
              body = path.read_text(errors="replace")
              hits = [term for term in terms if term.lower() in body.lower()]
              named = any(term in path.name.lower() for term in ("live", "configdialog", "settingactivity", "qrcode", "serverevent", "vodwall"))
              if hits or named:
                  candidates.append((path, body, hits))
          report.append("=== Candidate decompiled classes ===")
          for path, body, hits in candidates:
              report.append(f"{path.relative_to(source_root)} | hits={', '.join(hits) if hits else '(filename match)'}")
          report.append("")
          report.append("=== Candidate class code ===")
          for path, body, hits in candidates:
              lines = body.splitlines()
              report.append(f"--- {path.relative_to(source_root)} ({len(lines)} lines) ---")
              if len(lines) <= 700:
                  report.extend(f"{i+1}: {line}" for i, line in enumerate(lines))
              else:
                  indexes = [i for i, line in enumerate(lines) if any(t.lower() in line.lower() for t in terms)]
                  ranges = []
                  for i in indexes:
                      lo, hi = max(0, i-35), min(len(lines), i+70)
                      if ranges and lo <= ranges[-1][1]:
                          ranges[-1] = (ranges[-1][0], max(ranges[-1][1], hi))
                      else:
                          ranges.append((lo, hi))
                  for lo, hi in ranges[:10]:
                      report.extend(f"{i+1}: {lines[i]}" for i in range(lo, hi))
              report.append("")
          full = "\\n".join(report)
          (root / "reverse-engineering-report.txt").write_text(full, encoding="utf-8")
          print("=== AUTOBUILD170_REPORT_BEGIN ===")
          print(full[:60000])
          print("=== AUTOBUILD170_REPORT_END ===")
          PY

      - name: Upload decompilation report
        uses: actions/upload-artifact@v4
        with:
          name: AutoBuild-170-Reverse-Engineering
          path: build/autobuild170/reverse-engineering-report.txt
          if-no-files-found: error
          retention-days: 7
