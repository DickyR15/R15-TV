name: Decompile TV-AutoBuild 170 reference APK

on:
  push:
    branches:
      - "research/autobuild-170-port"
    paths:
      - ".github/workflows/decompile-autobuild-170.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout R15 TV workspace
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Download and verify official AutoBuild 170 APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reference build/targets
          curl -fL --retry 3 --retry-delay 2 "https://github.com/iptvorganization/TV-AutoBuild/releases/download/autobuild-170/TV-leanback-armeabi-v7a.apk" -o build/reference/TV-leanback-armeabi-v7a.apk
          echo "836fec0255d7f9860ef3d48b4680a26ee14301167e54c289346a551bb970da41  build/reference/TV-leanback-armeabi-v7a.apk" | sha256sum -c -

      - name: Install apktool and decompile
        shell: bash
        run: |
          set -euo pipefail
          URL="$(curl -fsSL https://api.github.com/repos/iBotPeaches/Apktool/releases/latest | jq -er '[.assets[] | select(.name | test("^apktool_.*\\.jar$"))][0].browser_download_url')"
          curl -fL --retry 3 "$URL" -o build/apktool.jar
          java -jar build/apktool.jar d -f build/reference/TV-leanback-armeabi-v7a.apk -o build/upstream-170
          test -d build/upstream-170/res

      - name: Inspect original layouts, activities, and phone-push references
        shell: bash
        run: |
          set -euo pipefail
          DECODED=build/upstream-170
          TARGETS=build/targets
          REPORT=build/upstream-170-decompile-report.txt
          : > "$REPORT"
          {
            echo "AUTO-BUILD 170 APK DECOMPILE REPORT"
            echo "APK: TV-leanback-armeabi-v7a.apk"
            echo "== App identity =="
            grep -nE '<manifest|android:label=|android:versionName=|android:versionCode=' "$DECODED/AndroidManifest.xml" | head -n 40 || true
            echo "== Relevant activity declarations =="
            grep -nE '<activity|android:name=.*(Live|Setting|Config|Push|Server)' "$DECODED/AndroidManifest.xml" | head -n 120 || true
            echo "== Exact layout resource names =="
            find "$DECODED/res" -type f -path '*/layout*/*.xml' | grep -Ei '/[^/]*(live|config|setting|source|vod|wall|push)[^/]*\.xml$' | sort || true
            for f in activity_setting.xml activity_live_config.xml activity_live_config_edit.xml adapter_live_config_source.xml dialog_config.xml; do
              if [ -f "$DECODED/res/layout/$f" ]; then
                echo "===== RESOURCE FILE: $f ====="
                sed -n '1,360p' "$DECODED/res/layout/$f"
              fi
            done
            echo "== Traditional Chinese labels used by the source/config screens =="
            grep -nE 'live_config|config.*(live|source)|source.*(live|url)|push_info|新增直播源|直播源|節目表|节目表|重新整理配置|刷新配置|setting_(vod|wall|live)|setting_live|setting_wall|setting_vod' "$DECODED/res/values-zh-rTW/strings.xml" | head -n 260 || true
            echo "== Candidate smali classes by original class names =="
            find "$DECODED"/smali* -type f -name '*.smali' | grep -Ei '/[^/]*(Live.*Config|Live.*Activity|SettingActivity|ConfigDialog|ServerEvent|QRCode|Nano|Action|Push).*\.smali$' | head -n 100 || true
            echo "== Smali references to configuration layout IDs and phone push routes =="
            grep -RIn -m 5 -E 'activity_live_config_edit|activity_live_config|adapter_live_config_source|ServerEvent;->setting|/action\?do=setting|/config' "$DECODED"/smali* 2>/dev/null | head -n 360 || true
          } | tee -a "$REPORT"

          while IFS= read -r f; do
            [ -f "$f" ] || continue
            mkdir -p "$TARGETS/$(dirname "$f")"
            cp "$f" "$TARGETS/$f"
          done < <(find "$DECODED/res" -type f -path '*/layout*/*.xml' | grep -Ei '/[^/]*(live|config|setting|source|vod|wall|push)[^/]*\.xml$' || true)
          for f in "$DECODED/res/values/strings.xml" "$DECODED/res/values-zh-rCN/strings.xml" "$DECODED/res/values-zh-rTW/strings.xml"; do
            if [ -f "$f" ]; then mkdir -p "$TARGETS/$(dirname "$f")"; cp "$f" "$TARGETS/$f"; fi
          done
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            mkdir -p "$TARGETS/$(dirname "$f")"
            cp "$f" "$TARGETS/$f"
          done < <(find "$DECODED"/smali* -type f -name '*.smali' | grep -Ei '/[^/]*(Live.*Config|Live.*Activity|SettingActivity|ConfigDialog|ServerEvent|QRCode|Nano|Action|Push).*\.smali$' | head -n 100 || true)
          {
            echo "== Decompiled reference files packaged =="
            find "$TARGETS" -type f | sort
          } | tee -a "$REPORT"
          zip -qr build/upstream-170-decompiled-reference.zip build/targets
          test -s "$REPORT"
          test -s build/upstream-170-decompiled-reference.zip
          { echo "## AutoBuild 170 APK decompile report"; echo; head -n 260 "$REPORT"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload decompiled reference
        uses: actions/upload-artifact@v4
        with:
          name: upstream-170-decompiled-reference
          path: |
            build/upstream-170-decompile-report.txt
            build/upstream-170-decompiled-reference.zip
          if-no-files-found: error
          retention-days: 14
