name: R15 TV 5.8.1 Clean Baseline Diagnostic
run-name: R15 TV 5.8.1 Clean Baseline Diagnostic

on:
  push:
    branches:
      - "diagnostic/live-media3-1.11.1-runtime-fix"
    paths:
      - ".github/workflows/build-media3-111-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r15tv-581-clean-baseline-${{ github.run_id }}
  cancel-in-progress: false

env:
  TV_REPOSITORY: FongMi/TV
  TV_SHA: 412e7d6b32ca545fbffc216b12b854a85a305ed1
  MEDIA_REPOSITORY: FongMi/media
  MEDIA_SHA: 2bc207851df311340767e913931ca7b28cab1794
  NDK_VERSION: 29.0.14206865

jobs:
  build:
    name: Build exact FongMi TV 5.8.1 baseline without local startup patches
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout diagnostic workflow
        uses: actions/checkout@v4
        with:
          ref: diagnostic/live-media3-1.11.1-runtime-fix

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python for source build tooling
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android build packages
        run: |
          set -euo pipefail
          sdkmanager --licenses </dev/null >/dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;${NDK_VERSION}"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Fetch current public FongMi TV source
        run: |
          set -euo pipefail
          mkdir -p sources/TV
          git -C sources/TV init
          git -C sources/TV remote add origin "https://github.com/${TV_REPOSITORY}.git"
          git -C sources/TV fetch --depth=1 origin "$TV_SHA"
          git -C sources/TV checkout --detach FETCH_HEAD
          test "$(git -C sources/TV rev-parse HEAD)" = "$TV_SHA"
          test -f sources/TV/app/build.gradle
          test -f sources/TV/app/src/leanback/java/com/fongmi/android/tv/ui/activity/LiveActivity.java
          grep -Fq 'versionCode 581' sources/TV/app/build.gradle
          grep -Fq 'versionName "5.8.1"' sources/TV/app/build.gradle
          grep -Fq 'RuntimeModule.PYTHON.require();' sources/TV/chaquo/src/main/java/com/fongmi/chaquo/Loader.java
          grep -Fq 'synchronized (Python.class)' sources/TV/chaquo/src/main/java/com/fongmi/chaquo/Loader.java
          echo "TV source pinned to $TV_REPOSITORY@$TV_SHA"
          echo "Verified exact upstream 5.8.1; upstream Chaquopy lock and PlaybackService process are preserved."

      - name: Verify upstream Chaquopy initialization is preserved
        run: |
          set -euo pipefail
          loader=sources/TV/chaquo/src/main/java/com/fongmi/chaquo/Loader.java
          grep -n -F "RuntimeModule.PYTHON.require();" "$loader"
          grep -n -F "synchronized (Python.class)" "$loader"
          grep -n -F 'Python.getInstance().getModule("app")' "$loader"
          if grep -q "R15ChaquopyInitTrace\|PYTHON_START_LOCK" "$loader"; then
            echo "Unexpected local Chaquopy mutation found in source." >&2
            exit 1
          fi
          echo "Clean baseline: no local Chaquopy startup patch applied."

      - name: Fetch current FongMi Media3 fork compatible with the pinned 5.8.1 source
        run: |
          set -euo pipefail
          mkdir -p sources/media
          git -C sources/media init
          git -C sources/media config user.name "R15 TV Diagnostic Builder"
          git -C sources/media config user.email "actions@users.noreply.github.com"
          git -C sources/media remote add fongmi "https://github.com/${MEDIA_REPOSITORY}.git"
          git -C sources/media fetch --depth=1 fongmi "$MEDIA_SHA"
          git -C sources/media checkout --detach FETCH_HEAD
          test "$(git -C sources/media rev-parse HEAD)" = "$MEDIA_SHA"
          grep -Fq 'releaseVersion = "1.11.0"' sources/media/gradle/libs.versions.toml
          echo "Pinned compatible media source: FongMi/media@$MEDIA_SHA (Media3 1.11.0).";
      - name: Build FongMi Media3 1.11.0 and MPV AARs with verifiable upstream commit
        working-directory: sources/media
        timeout-minutes: 80
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace --console=plain --max-workers=2 \
            :lib-common:assembleRelease \
            :lib-container:assembleRelease \
            :lib-database:assembleRelease \
            :lib-datasource:assembleRelease \
            :lib-datasource-okhttp:assembleRelease \
            :lib-datasource-rtmp:assembleRelease \
            :lib-decoder:assembleRelease \
            :lib-decoder-ffmpeg:assembleRelease \
            :lib-decoder-mpegh:assembleRelease \
            :lib-effect:assembleRelease \
            :lib-exoplayer:assembleRelease \
            :lib-exoplayer-dash:assembleRelease \
            :lib-exoplayer-hls:assembleRelease \
            :lib-exoplayer-rtsp:assembleRelease \
            :lib-exoplayer-smoothstreaming:assembleRelease \
            :lib-extractor:assembleRelease \
            :lib-mpvplayer:assembleRelease \
            :lib-session:assembleRelease \
            :lib-ui:assembleRelease \
            :lib-ui-danmaku:assembleRelease

          target="$GITHUB_WORKSPACE/sources/TV/app/libs"
          mkdir -p "$target"
          copied=0
          while IFS= read -r aar_name; do
            [[ -n "$aar_name" ]] || continue
            aar_path=$(find libraries -type f -name "$aar_name" -print -quit)
            if [[ -z "$aar_path" || ! -f "$aar_path" ]]; then
              echo "Missing expected AAR: $aar_name" >&2
              exit 1
            fi
            cp "$aar_path" "$target/$aar_name"
            copied=$((copied + 1))
          done < move.txt
          if [[ "$copied" -ne 20 ]]; then
            echo "Expected 20 Media3/MPV AARs but copied $copied." >&2
            exit 1
          fi
          ls -lh "$target"/lib-*-release.aar

      - name: Configure isolated R15 TV diagnostic package
        working-directory: sources/TV
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/sources"
          keytool -genkeypair -noprompt -keystore "$GITHUB_WORKSPACE/sources/r15tv-baseline581.jks" \
            -storepass "baseline581-local-only" -keypass "baseline581-local-only" -alias r15tv \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=R15 TV 5.8.1 Clean Baseline, O=R15 TV, C=TW"
          cat > local.properties <<EOF_PROPERTIES
          sdk.dir=$ANDROID_HOME
          storeFile=../r15tv-diag111.jks
          keyAlias=r15tv
          storePassword=baseline581-local-only
          keyPassword=baseline581-local-only
          EOF_PROPERTIES
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle_file = Path("app/build.gradle")
          text = gradle_file.read_text(encoding="utf-8")
          app_id, n1 = re.subn(
              r'(?m)^(\s*applicationId\s+)"[^"]+"\s*$',
              r'\g<1>"com.dicky.r15tv.base581"',
              text,
              count=1,
          )
          app_id, n2 = re.subn(
              r'(?m)^(\s*versionCode\s+)\d+\s*$',
              r'\g<1>581102526',
              app_id,
              count=1,
          )
          app_id, n3 = re.subn(
              r'(?m)^(\s*versionName\s+)"[^"]+"\s*$',
              r'\g<1>"5.8.1-r15-clean-baseline"',
              app_id,
              count=1,
          )
          if (n1, n2, n3) != (1, 1, 1):
              raise SystemExit(f"Expected one app id/version anchor, found {(n1,n2,n3)}")
          gradle_file.write_text(app_id, encoding="utf-8")

          # Do not alter upstream AndroidManifest.xml or PlaybackService process behavior.
          print("Clean baseline: upstream manifest and PlaybackService process configuration preserved.")

          label = "R15 TV 5.8.1 原始基底診斷"
          for path in Path("app/src/main/res").glob("values*/strings.xml"):
              xml = path.read_text(encoding="utf-8")
              updated = re.sub(
                  r'(<string\s+name="app_name"[^>]*>).*?(</string>)',
                  lambda m: m.group(1) + label + m.group(2),
                  xml,
                  count=1,
                  flags=re.DOTALL,
              )
              if updated != xml:
                  path.write_text(updated, encoding="utf-8")
          print("Package: com.dicky.r15tv.base581")
          print("Label: " + label)
          print("Source TV commit: 412e7d6b32ca545fbffc216b12b854a85a305ed1 (exact 5.8.1 source)")
          print("Media3 compatibility target: FongMi/media 1.11.0")
          PY

      - name: Build Android TV ARM64 and ARMv7 clean baseline APKs
        working-directory: sources/TV
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace --console=plain --max-workers=2 :app:assembleLeanbackDebug
          mkdir -p "$GITHUB_WORKSPACE/dist"
          : > "$GITHUB_WORKSPACE/dist/SHA256SUMS.txt"

          for abi in arm64-v8a armeabi-v7a; do
            apk=""
            while IFS= read -r -d '' candidate; do
              badging=$(aapt dump badging "$candidate")
              # Prefer ABI-split APKs so a native TV device can be tested without Houdini.
              if grep -Fq "native-code: '$abi'" <<<"$badging"; then
                native_line=$(grep -F "native-code:" <<<"$badging" | head -n 1 || true)
                if [[ "$native_line" == "native-code: '$abi'" ]]; then
                  apk="$candidate"
                  break
                fi
              fi
            done < <(find app/build/outputs/apk -type f -name '*.apk' -print0)

            if [[ -z "$apk" ]]; then
              echo "Could not find an APK containing only the $abi ABI." >&2
              echo "Built APK candidates:" >&2
              while IFS= read -r candidate; do
                echo "--- $candidate" >&2
                aapt dump badging "$candidate" | grep -E "^(package:|native-code:)" >&2 || true
              done < <(find app/build/outputs/apk -type f -name '*.apk' -print)
              exit 1
            fi

            output="$GITHUB_WORKSPACE/dist/R15-TV-5.8.1-Clean-Baseline-${abi}.apk"
            cp "$apk" "$output"
            badging=$(aapt dump badging "$output")
            grep -Fq "package: name='com.dicky.r15tv.base581'" <<<"$badging"
            grep -Fq "native-code: '$abi'" <<<"$badging"
            unzip -Z1 "$output" | grep -Fq "lib/$abi/"
            grep -Fq "versionName='5.8.1-r15-clean-baseline'" <<<"$badging"
            manifest_dump=$(aapt dump xmltree "$output" AndroidManifest.xml)
            if grep -Eq 'android:process.*:playback' <<<"$manifest_dump"; then
              echo "Unexpected cross-process PlaybackService override." >&2
              exit 1
            fi
            sha256sum "$output" | tee -a "$GITHUB_WORKSPACE/dist/SHA256SUMS.txt"
            echo "Built and verified $abi: $output"
          done

          cat > "$GITHUB_WORKSPACE/dist/BUILD_INFO.txt" <<EOF_INFO
          Build: R15 TV 5.8.1 Clean Baseline Diagnostic
          TV source: FongMi/TV@$TV_SHA (versionCode 581, versionName 5.8.1)
          Media3: compatible FongMi/media@$MEDIA_SHA (1.11.0)
          Package: com.dicky.r15tv.base581
          Variants: Leanback ARM64 and ARMv7, debug-signed clean source baseline only
          Goal: exact FongMi/TV 5.8.1 source; no local Loader.java or AndroidManifest.xml modifications. Isolates whether the previous crash was caused by the legacy source/patch workflow.
          Test armeabi-v7a first on LDPlayer Android 9 API 28. This clean-baseline package is side-by-side and does not inherit original app settings.
          EOF_INFO

      - name: Upload ARM64 and ARMv7 diagnostic APKs
        uses: actions/upload-artifact@v4
        with:
          name: R15-TV-5.8.1-Clean-Baseline-ARM64-ARMv7
          path: |
            dist/R15-TV-5.8.1-Clean-Baseline-arm64-v8a.apk
            dist/R15-TV-5.8.1-Clean-Baseline-armeabi-v7a.apk
            dist/BUILD_INFO.txt
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
