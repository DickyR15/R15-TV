name: R15 TV 5.8.1 LDPlayer Crash Diagnostic
run-name: R15 TV 5.8.1 LDPlayer Crash Diagnostic

on:
  push:
    branches:
      - "diagnostic/live-media3-1.11.1-runtime-fix"
    paths:
      - ".github/workflows/build-media3-111-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r15tv-581-ldplayer-crash-${{ github.run_id }}
  cancel-in-progress: false

env:
  TV_REPOSITORY: FongMi/TV
  TV_SHA: 2d0bbcf0556b4ac3ab6b3b307436d70d78c78c24
  MEDIA_REPOSITORY: FongMi/media
  MEDIA_SHA: 3c2cbe8ac742c2fe15eff52f03eeb3b1b648848d
  NDK_VERSION: 29.0.14206865

jobs:
  build:
    name: Build FongMi TV 5.8.x with LDPlayer crash diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout diagnostic workflow
        uses: actions/checkout@v4
        with:
          ref: diagnostic/live-media3-1.11.1-runtime-fix

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python for source build tooling
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android build packages
        run: |
          set -euo pipefail
          sdkmanager --licenses </dev/null >/dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;${NDK_VERSION}"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Fetch current public FongMi TV source
        run: |
          set -euo pipefail
          mkdir -p sources/TV
          git -C sources/TV init
          git -C sources/TV remote add origin "https://github.com/${TV_REPOSITORY}.git"
          git -C sources/TV fetch --depth=1 origin "$TV_SHA"
          git -C sources/TV checkout --detach FETCH_HEAD
          test "$(git -C sources/TV rev-parse HEAD)" = "$TV_SHA"
          test -f sources/TV/app/build.gradle
          test -f sources/TV/app/src/leanback/java/com/fongmi/android/tv/ui/activity/LiveActivity.java
          echo "TV source pinned to $TV_REPOSITORY@$TV_SHA"
          echo "Use FongMi 5.8.x baseline; preserve same-process PlaybackService LocalBinder semantics. Test UI software rendering for the LDPlayer EGL/RenderThread crash."

      - name: Serialize Chaquopy startup and add diagnostics
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/serialize-chaquopy-loader-init.py
          python3 scripts/serialize-chaquopy-loader-init.py --tv-dir sources/TV
          grep -n -F "PYTHON_START_LOCK" sources/TV/chaquo/src/main/java/com/fongmi/chaquo/Loader.java

      - name: Fetch compatible FongMi Media3 1.11.0 fork
        run: |
          set -euo pipefail
          mkdir -p sources/media
          git -C sources/media init
          git -C sources/media config user.name "R15 TV Diagnostic Builder"
          git -C sources/media config user.email "actions@users.noreply.github.com"
          git -C sources/media remote add fongmi "https://github.com/${MEDIA_REPOSITORY}.git"
          git -C sources/media fetch --depth=1 fongmi "$MEDIA_SHA"
          git -C sources/media checkout --detach FETCH_HEAD
          test "$(git -C sources/media rev-parse HEAD)" = "$MEDIA_SHA"
          grep -Fq 'releaseVersion = "1.11.0"' sources/media/gradle/libs.versions.toml
          echo "Pinned compatible media source: FongMi/media@$MEDIA_SHA (Media3 1.11.0)."
      - name: Build Media3 and MPV release AARs
        working-directory: sources/media
        timeout-minutes: 80
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace --console=plain --max-workers=2 \
            :lib-common:assembleRelease \
            :lib-container:assembleRelease \
            :lib-database:assembleRelease \
            :lib-datasource:assembleRelease \
            :lib-datasource-okhttp:assembleRelease \
            :lib-datasource-rtmp:assembleRelease \
            :lib-decoder:assembleRelease \
            :lib-decoder-ffmpeg:assembleRelease \
            :lib-decoder-mpegh:assembleRelease \
            :lib-effect:assembleRelease \
            :lib-exoplayer:assembleRelease \
            :lib-exoplayer-dash:assembleRelease \
            :lib-exoplayer-hls:assembleRelease \
            :lib-exoplayer-rtsp:assembleRelease \
            :lib-exoplayer-smoothstreaming:assembleRelease \
            :lib-extractor:assembleRelease \
            :lib-mpvplayer:assembleRelease \
            :lib-session:assembleRelease \
            :lib-ui:assembleRelease \
            :lib-ui-danmaku:assembleRelease

          target="$GITHUB_WORKSPACE/sources/TV/app/libs"
          mkdir -p "$target"
          copied=0
          while IFS= read -r aar_name; do
            [[ -n "$aar_name" ]] || continue
            aar_path=$(find libraries -type f -name "$aar_name" -print -quit)
            if [[ -z "$aar_path" || ! -f "$aar_path" ]]; then
              echo "Missing expected AAR: $aar_name" >&2
              exit 1
            fi
            cp "$aar_path" "$target/$aar_name"
            copied=$((copied + 1))
          done < move.txt
          if [[ "$copied" -ne 20 ]]; then
            echo "Expected 20 Media3/MPV AARs but copied $copied." >&2
            exit 1
          fi
          ls -lh "$target"/lib-*-release.aar

      - name: Configure isolated R15 TV diagnostic package
        working-directory: sources/TV
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/sources"
          keytool -genkeypair -noprompt -keystore "$GITHUB_WORKSPACE/sources/r15tv-diag111.jks" \
            -storepass "diag111-local-only" -keypass "diag111-local-only" -alias r15tv \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=R15 TV Chaquopy Loader Diagnostic, O=R15 TV, C=TW"
          cat > local.properties <<EOF_PROPERTIES
          sdk.dir=$ANDROID_HOME
          storeFile=../r15tv-diag111.jks
          keyAlias=r15tv
          storePassword=diag111-local-only
          keyPassword=diag111-local-only
          EOF_PROPERTIES
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle_file = Path("app/build.gradle")
          text = gradle_file.read_text(encoding="utf-8")
          app_id, n1 = re.subn(
              r'(?m)^(\s*applicationId\s+)"[^"]+"\s*$',
              r'\g<1>"com.dicky.r15tv.diag581"',
              text,
              count=1,
          )
          app_id, n2 = re.subn(
              r'(?m)^(\s*versionCode\s+)\d+\s*$',
              r'\g<1>581102426',
              app_id,
              count=1,
          )
          app_id, n3 = re.subn(
              r'(?m)^(\s*versionName\s+)"[^"]+"\s*$',
              r'\g<1>"5.8.1-r15-ldplayer-egl-test"',
              app_id,
              count=1,
          )
          if (n1, n2, n3) != (1, 1, 1):
              raise SystemExit(f"Expected one app id/version anchor, found {(n1,n2,n3)}")
          gradle_file.write_text(app_id, encoding="utf-8")

          # LDPlayer logs show EGL_NOT_INITIALIZED followed by a RenderThread abort.
          # Disable hardware acceleration for UI only. PlaybackService must remain
          # in the default process because activities cast its binder to LocalBinder.
          manifest_file = Path("app/src/main/AndroidManifest.xml")
          manifest = manifest_file.read_text(encoding="utf-8")
          manifest, hardware_count = re.subn(
              r'(?s)(<application\b[^>]*android:hardwareAccelerated=")true(")',
              r'\g<1>false\2',
              manifest,
              count=1,
          )
          if hardware_count != 1:
              raise SystemExit(f"Expected one application hardwareAccelerated=true, got {hardware_count}")
          if 'android:process=":playback"' in manifest:
              raise SystemExit("PlaybackService must remain in the default process; LocalBinder is used.")
          manifest_file.write_text(manifest, encoding="utf-8")
          print("EGL test: application hardware acceleration disabled; PlaybackService remains in default process.")

          label = "R15 TV 雷電閃退診斷"
          for path in Path("app/src/main/res").glob("values*/strings.xml"):
              xml = path.read_text(encoding="utf-8")
              updated = re.sub(
                  r'(<string\s+name="app_name"[^>]*>).*?(</string>)',
                  lambda m: m.group(1) + label + m.group(2),
                  xml,
                  count=1,
                  flags=re.DOTALL,
              )
              if updated != xml:
                  path.write_text(updated, encoding="utf-8")
          print("Package: com.dicky.r15tv.diag581")
          print("Label: " + label)
          print("Source TV commit: 2d0bbcf0556b4ac3ab6b3b307436d70d78c78c24 (5.8.x branch baseline)")
          print("Media3 compatibility target: FongMi/media 1.11.0")
          PY

      - name: Build Android TV ARM64 and ARMv7 LDPlayer diagnostic APKs
        working-directory: sources/TV
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace --console=plain --max-workers=2 :app:assembleLeanbackDebug
          mkdir -p "$GITHUB_WORKSPACE/dist"
          : > "$GITHUB_WORKSPACE/dist/SHA256SUMS.txt"

          for abi in arm64-v8a armeabi-v7a; do
            apk=""
            while IFS= read -r -d '' candidate; do
              badging=$(aapt dump badging "$candidate")
              # Prefer ABI-split APKs so a native TV device can be tested without Houdini.
              if grep -Fq "native-code: '$abi'" <<<"$badging"; then
                native_line=$(grep -F "native-code:" <<<"$badging" | head -n 1 || true)
                if [[ "$native_line" == "native-code: '$abi'" ]]; then
                  apk="$candidate"
                  break
                fi
              fi
            done < <(find app/build/outputs/apk -type f -name '*.apk' -print0)

            if [[ -z "$apk" ]]; then
              echo "Could not find an APK containing only the $abi ABI." >&2
              echo "Built APK candidates:" >&2
              while IFS= read -r candidate; do
                echo "--- $candidate" >&2
                aapt dump badging "$candidate" | grep -E "^(package:|native-code:)" >&2 || true
              done < <(find app/build/outputs/apk -type f -name '*.apk' -print)
              exit 1
            fi

            output="$GITHUB_WORKSPACE/dist/R15-TV-5.8.1-LDPlayer-Crash-${abi}.apk"
            cp "$apk" "$output"
            badging=$(aapt dump badging "$output")
            grep -Fq "package: name='com.dicky.r15tv.diag581'" <<<"$badging"
            grep -Fq "native-code: '$abi'" <<<"$badging"
            unzip -Z1 "$output" | grep -Fq "lib/$abi/"
            manifest_dump=$(aapt dump xmltree "$output" AndroidManifest.xml)
            grep -Eq 'android:hardwareAccelerated.*(false|0x0)' <<<"$manifest_dump"
            if grep -Eq 'android:process.*:playback' <<<"$manifest_dump"; then
              echo "PlaybackService must remain in the default process." >&2
              exit 1
            fi
            sha256sum "$output" | tee -a "$GITHUB_WORKSPACE/dist/SHA256SUMS.txt"
            echo "Built and verified $abi: $output"
          done

          cat > "$GITHUB_WORKSPACE/dist/BUILD_INFO.txt" <<EOF_INFO
          Build: R15 TV 5.8.1 LDPlayer Crash Diagnostic
          TV source: FongMi/TV@$TV_SHA
          Media3: compatible FongMi/media@$MEDIA_SHA (1.11.0)
          Package: com.dicky.r15tv.diag581
          Variants: Leanback ARM64 and ARMv7, debug-signed LDPlayer stability diagnostic only
          Goal: start from FongMi 5.8.x source, retain PlaybackService in the app process, preserve Chaquopy initialization synchronization, and test UI software rendering against LDPlayer EGL/RenderThread crashes.
          Test armeabi-v7a first on LDPlayer Android 9 API 28. This diagnostic package is side-by-side and does not inherit original app settings.
          EOF_INFO

      - name: Upload ARM64 and ARMv7 diagnostic APKs
        uses: actions/upload-artifact@v4
        with:
          name: R15-TV-5.8.1-LDPlayer-Crash-ARM64-ARMv7
          path: |
            dist/R15-TV-5.8.1-LDPlayer-Crash-arm64-v8a.apk
            dist/R15-TV-5.8.1-LDPlayer-Crash-armeabi-v7a.apk
            dist/BUILD_INFO.txt
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
